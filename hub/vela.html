<script>
let lastBars = [];
const provider = {
  async listSymbols() {
    return LabSymbols.map((s) => ({ ticker: s.ticker, description: s.name, type: /crypto|bybit-(perp|spot|futures|inverse|mark|index)/.test(s.group) ? "crypto" : /forex/.test(s.group) ? "forex" : s.group === "arm-stock" ? "stock" : /index|indices/.test(s.group) ? "index" : "commodity" }));
  },
  async getBars(ticker, timeframe, range = {}) {
    const tf = LabTF.fromAny(timeframe);
    const want = range.limit || 1000;
    // Feeds cap one reply (remote MT5 5000, Bybit/Binance 1000). Vela treats a short reply as "no older history exists",
    // so page backwards here until we have what Vela asked for, or the feed runs out (2026-11-13).
    let out = [], to = range.to;
    for (let page = 0; page < 40 && out.length < want; page++) {
      const got = (await LabFeed.history(ticker, tf, to, want - out.length)).map((b) => ({ ...b, time: b.time * 1000 }));
      const older = out.length ? got.filter((b) => b.time < out[0].time) : got;
      if (!older.length) break;
      out = older.concat(out);
      if (range.from && out[0].time <= range.from) break;
      to = out[0].time - 1;
    }
    if (range.from) out = out.filter((b) => b.time >= range.from);
    if (!range.to) { lastBars = out; setTimeout(applyTheme, 400); }  // the volume indicator mounts with the data: colour it then
    return out;
  },
  subscribe(ticker, timeframe, onBar) {
    const tf = LabTF.fromAny(timeframe), step = LabTF.sec[tf] * 1000;
    let chain = Promise.resolve();
    const push = (bar) => {
      const last = lastBars[lastBars.length - 1];
      if (last && bar.time < last.time) return;
      if (last && last.time === bar.time) lastBars[lastBars.length - 1] = bar; else lastBars.push(bar);
      onBar(bar);
    };
    return LabFeed.live(ticker, tf, (b) => {
      const bar = { ...b, time: b.time * 1000 };
      chain = chain.then(async () => {
        // A live candle far after our last one means candles are missing (laptop slept, feed reconnected, or the
        // first load came from a stale cache). Vela does not fill such a hole by itself: fetch the missing candles
        // first, so the chart and every indicator stay continuous (2026-11-13).
        const last = lastBars[lastBars.length - 1];
        if (last && bar.time - last.time > 2 * step) {
          try {
            const n = Math.min(5000, Math.ceil((bar.time - last.time) / step) + 5);
            const fill = await LabFeed.history(ticker, tf, undefined, n);
            for (const f of fill) { const t = f.time * 1000; if (t > last.time && t < bar.time) push({ ...f, time: t }); }
          } catch (e) { console.warn("gap fill failed", e); }
        }
        push(bar);
      });
    });
  },
};

let ws;
// A Pine barcolor() repaints candle bodies over the user's colours. The hub's setting wins unless "Let indicators recolour candles" is on.
class HubPineEngine extends VelaLab.PineWorkerEngine {
  execute(req, handlers) {
    const h = Object.create(handlers);
    h.onModel = (model) => { if (!HubSettingsLoad().indicatorBars && model && model.barColors) model = { ...model, barColors: undefined }; handlers.onModel(model); };
    return super.execute(req, h);
  }
}
// Inside the TradeX, Vela's own "Indicators" button opens the hub's own Indicators dialog
// (Vela native indicators + your own Pine scripts in one place).
if (LabEmbedded && VelaLab.registerWidgetAction) {
  VelaLab.registerWidgetAction({ id: "indicators", target: "topbar", align: "left", label: "Indicators", icon: "indicators",
    run: () => window.parent.postMessage({ evt: "indicators:open" }, location.origin) });
}
// ---- Theme (TradeX settings) ----
// hexA() comes from theme.js
function velaTheme() { const t = HubTheme; return { background: t.bg, textColor: t.text, gridColor: t.grid, borderColor: t.line, upColor: t.up, downColor: t.down, fontFamily: t.font }; }
// Candle colours sync with the hub's Settings panel and persist across reloads.
let _applyingTheme = false;
function guardCandleColours(chart) {
  if (chart.hubGuarded) return;
  chart.hubGuarded = true;
  try {
    chart.renderer.onConfigChanged(() => {
      if (_applyingTheme) return;
      const cfg = chart.renderer.getConfig();
      if (cfg && cfg.candles) {
        const c = cfg.candles;
        if (c.upColor !== HubTheme.up || c.downColor !== HubTheme.down) {
          const cur = HubSettingsLoad();
          cur.overrides = cur.overrides || {};
          cur.overrides.up = c.upColor;
          cur.overrides.down = c.downColor;
          HubSettingsSave(cur);
          HubThemeApply();
        }
      }
      try {
        const userCfg = {
          candles: cfg.candles,
          bars: cfg.bars,
          line: cfg.line,
          area: cfg.area,
          baseline: cfg.baseline,
          series: cfg.series,
          animations: cfg.animations,
          layout: cfg.layout,
          panes: cfg.panes,
          priceScale: cfg.priceScale,
          timeScale: cfg.timeScale,
          margins: cfg.margins,
          crosshair: cfg.crosshair,
          grid: cfg.grid,
          chartTypes: cfg.chartTypes
        };
        localStorage.setItem("tradex_chart_config", JSON.stringify(userCfg));
      } catch (_) {}
    });
  } catch (e) { console.warn("config guard", e); }
}
function colorChart(chart) {
  const t = HubTheme;
  guardCandleColours(chart);
  let savedCfg = {};
  try { savedCfg = JSON.parse(localStorage.getItem("tradex_chart_config") || "{}"); } catch (_) {}
  _applyingTheme = true;
  try {
    chart.renderer.applyConfig({
      layout: { background: t.bg, textColor: t.text, fontFamily: t.font, ...(savedCfg.layout || {}) },
      grid: {
        vertLines: { color: t.grid, ...(savedCfg.grid && savedCfg.grid.vertLines ? savedCfg.grid.vertLines : {}) },
        horzLines: { color: t.grid, ...(savedCfg.grid && savedCfg.grid.horzLines ? savedCfg.grid.horzLines : {}) }
      },
      crosshair: { color: t.dim, labelBackground: t.raised, ...(savedCfg.crosshair || {}) },
      priceScale: { borderColor: t.line, ...(savedCfg.priceScale || {}) },
      panes: { separatorColor: t.line, ...(savedCfg.panes || {}) },
      candles: { upColor: t.up, downColor: t.down, borderUpColor: t.up, borderDownColor: t.down, wickUpColor: t.up, wickDownColor: t.down, ...(savedCfg.candles || {}) },
      bars: { upColor: t.up, downColor: t.down, ...(savedCfg.bars || {}) },
      line: { color: t.accent, ...(savedCfg.line || {}) },
      area: { lineColor: t.accent, topColor: hexA(t.accent, 0.28), bottomColor: hexA(t.accent, 0.02), ...(savedCfg.area || {}) },
      baseline: { topLineColor: t.up, bottomLineColor: t.down, topFillColor: hexA(t.up, 0.25), bottomFillColor: hexA(t.down, 0.25), ...(savedCfg.baseline || {}) },
      trades: { longColor: t.up, shortColor: t.down },
      ...(savedCfg.series ? { series: savedCfg.series } : {}),
      ...(savedCfg.animations ? { animations: savedCfg.animations } : {}),
      ...(savedCfg.timeScale ? { timeScale: savedCfg.timeScale } : {}),
      ...(savedCfg.chartTypes ? { chartTypes: savedCfg.chartTypes } : {}),
      margins: { top: 8, bottom: 8, right: 2, ...(savedCfg.margins && savedCfg.margins.right !== 10 ? savedCfg.margins : { right: 2 }) }
    });
  } catch (e) { console.warn("theme config", e); } finally {
    _applyingTheme = false;
  }
  try { // built-in volume keeps its own colours: recolour it only if it is on the chart
    const volRemoved = localStorage.getItem("tradex_volume_removed") === "1";
    if (!volRemoved && chart.presentNativeIndicators && chart.presentNativeIndicators().includes("volume")) {
      chart.addNativeIndicator("volume").setInputs({ upColor: t.up + "6b", downColor: t.down + "6b" });
    }
  } catch (e) { console.warn("volume colours", e); }
}
function applyTheme() {
  try { ws.setTheme(velaTheme()); } catch (e) { console.warn("setTheme", e); }
  (ws.cells ? ws.cells() : [ws.active]).forEach((c) => c && c.chart && colorChart(c.chart));
  try {
    const hs = JSON.parse(localStorage.getItem("tradex_chart_host_settings") || "null");
    if (hs && typeof hs === "object") {
      const cell = ws && (ws.active || (ws.cells && ws.cells()[0]));
      if (cell) {
        if (typeof hs.watermark === "boolean" && cell.setWatermarkVisible) cell.setWatermarkVisible(hs.watermark);
        if (typeof hs.replayWatermark === "boolean" && cell.setReplayWatermarkVisible) cell.setReplayWatermarkVisible(hs.replayWatermark);
        if (hs.statusline && cell.setStatuslinePart) {
          for (const [k, v] of Object.entries(hs.statusline)) cell.setStatuslinePart(k, !!v);
        }
        if (typeof hs.indicatorTitles === "boolean" && cell.setIndicatorTitlesVisible) cell.setIndicatorTitlesVisible(hs.indicatorTitles);
        if (typeof hs.indicatorValues === "boolean" && cell.setIndicatorValuesVisible) cell.setIndicatorValuesVisible(hs.indicatorValues);
      }
    }
  } catch (_) {}
}
const VELA_TF = { M1: "1", M3: "3", M5: "5", M15: "15", M30: "30", H1: "60", H4: "240", D1: "1D", W1: "1W", MN: "1M" };
// Persistent drawings & tool defaults per symbol (localStorage + backend disk storage)
let lastSavedJSON = "";
let saveTimer = null;

function saveDrawings(sym) {
  sym = sym || window.LabDefaultSymbol;
  if (!sym || !ws || !ws.chart || !ws.chart.drawings || !ws.chart.drawings.toJSON) return;
  try {
    const data = ws.chart.drawings.toJSON();
    const toolDefaults = (ws.chart.drawings.toolDefaults && ws.chart.drawings.toolDefaults()) || {};
    const toolTemplates = (ws.chart.drawings.toolTemplates && ws.chart.drawings.toolTemplates()) || (window.TradeXDrawingTemplates && window.TradeXDrawingTemplates.load()) || {};
    const payloadStr = JSON.stringify({ drawings: data, toolDefaults, toolTemplates });
    if (payloadStr === lastSavedJSON) return;
    lastSavedJSON = payloadStr;

    // 1. Save to localStorage immediately
    if (data && data.drawings && data.drawings.length) {
      localStorage.setItem("tradex_drawings_" + sym, JSON.stringify(data));
    } else {
      localStorage.removeItem("tradex_drawings_" + sym);
    }
    if (Object.keys(toolDefaults).length) {
      localStorage.setItem("tradex_tool_defaults", JSON.stringify(toolDefaults));
    }
    if (Object.keys(toolTemplates).length) {
      localStorage.setItem("tradex_tool_templates", JSON.stringify(toolTemplates));
    }

    // 2. Save to backend disk (/api/drawings) with keepalive: true so browser finishes save even on page refresh
    try {
      fetch("/api/drawings?symbol=" + encodeURIComponent(sym), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payloadStr,
        keepalive: true
      }).catch(() => {});
    } catch (_) {}
  } catch (e) { console.warn("save drawings", e); }
}

function scheduleSave(sym) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveDrawings(sym), 80);
}

function restoreDrawings(sym) {
  sym = sym || window.LabDefaultSymbol;
  if (!sym || !ws || !ws.chart || !ws.chart.drawings) return;
  const d = ws.chart.drawings;

  // 1. Instant synchronous restore from localStorage
  try {
    const td = localStorage.getItem("tradex_tool_defaults");
    if (td && d.setToolDefaults) d.setToolDefaults(JSON.parse(td));
    const tt = localStorage.getItem("tradex_tool_templates");
    if (tt && d.setToolTemplates) d.setToolTemplates(JSON.parse(tt));
    const raw = localStorage.getItem("tradex_drawings_" + sym);
    if (raw && d.fromJSON) {
      const data = JSON.parse(raw);
      d.fromJSON(data);
      lastSavedJSON = JSON.stringify({ drawings: data, toolDefaults: (d.toolDefaults && d.toolDefaults()) || {}, toolTemplates: (d.toolTemplates && d.toolTemplates()) || {} });
    }
  } catch (e) { console.warn("restore local drawings", e); }

  // 2. Check backend storage to ensure latest server state is synced
  try {
    fetch("/api/drawings?symbol=" + encodeURIComponent(sym))
      .then((r) => r.json())
      .then((res) => {
        if (!res) return;
        if (res.toolDefaults && d.setToolDefaults && Object.keys(res.toolDefaults).length) {
          d.setToolDefaults(res.toolDefaults);
        }
        if (res.toolTemplates && d.setToolTemplates && Object.keys(res.toolTemplates).length) {
          d.setToolTemplates(res.toolTemplates);
        }
        if (res.drawings && res.drawings.drawings && res.drawings.drawings.length) {
          if (!d.all().length) {
            d.fromJSON(res.drawings);
          }
          lastSavedJSON = JSON.stringify({ drawings: res.drawings, toolDefaults: res.toolDefaults || {}, toolTemplates: res.toolTemplates || {} });
        }
      })
      .catch(() => {});
  } catch (_) {}
}

// Event hooks to guarantee drawing settings are saved BEFORE any refresh
window.addEventListener("beforeunload", () => saveDrawings());
window.addEventListener("pagehide", () => saveDrawings());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveDrawings();
});

// Capture any user edits in the floating bar (.vela-dpop), settings dialog, or drawing canvas
document.addEventListener("pointerup", (e) => {
  if (e.target && e.target.closest && e.target.closest(".vela-dpop, .vela-dialog, .vela-menu, canvas, .tx-favbar")) {
    scheduleSave();
  }
}, true);

document.addEventListener("change", (e) => {
  if (e.target && e.target.closest && e.target.closest(".vela-dpop, .vela-dialog, .vela-menu")) {
    scheduleSave();
  }
}, true);

document.addEventListener("input", (e) => {
  if (e.target && e.target.closest && e.target.closest(".vela-dpop, .vela-dialog")) {
    scheduleSave();
  }
}, true);

// Periodic check: every 1 second, if serialized drawings changed, save automatically
setInterval(() => {
  try {
    if (ws && ws.chart && ws.chart.drawings && ws.chart.drawings.toJSON) {
      const data = ws.chart.drawings.toJSON();
      const td = (ws.chart.drawings.toolDefaults && ws.chart.drawings.toolDefaults()) || {};
      const cur = JSON.stringify({ drawings: data, toolDefaults: td });
      if (cur !== lastSavedJSON) {
        saveDrawings();
      }
    }
  } catch (_) {}
}, 1000);

function build(layout) {
  const host = document.getElementById("chart");
  if (ws && ws.destroy) ws.destroy();
  host.innerHTML = "";
  const volumeDisabled = localStorage.getItem("tradex_volume_removed") === "1";
  ws = new VelaLab.VelaWorkspace(host, {
    // "1" (not false) so the layout can change in place later; top-level symbol/timeframe are every cell's default.
    layout: layout || "1", symbol: "lab:" + LabDefaultSymbol, timeframe: VELA_TF[LabDefaultTF], live: true,
    volume: !volumeDisabled,
    chart: { volume: !volumeDisabled },
    chartDefaults: { volume: !volumeDisabled },
    // History depth. Vela's default is 500 candles and it does NOT load more when you scroll left, so 1m-15m charts
    // only reached back a few days. More: chart settings > Advanced > Bars to fetch, or the 3M/6M/1Y buttons (2026-11-13).
    bars: 1000,
    theme: velaTheme(), upColor: HubTheme.up, downColor: HubTheme.down,
    providers: { lab: () => provider }, persist: false,
    // Inside the TradeX wrapper, symbol / timeframe / layout live in the wrapper's bar only (no duplicate controls).
    ...(LabEmbedded ? { topbar: false } : {}),
    // Pine Script runs in its own worker per chart (PineTS via @luxalgo/vela-pinets), so heavy scripts never freeze the chart.
    engines: { pine: () => new HubPineEngine() },
  });
  window.ws = ws;
  if (volumeDisabled) {
    (ws.cells ? ws.cells() : [ws.active]).forEach((c) => {
      if (c && c.chart) {
        if (c.chart.orchestrator) c.chart.orchestrator.volumeOptedOut = true;
        try {
          if (c.chart.presentNativeIndicators && c.chart.presentNativeIndicators().includes("volume")) {
            c.chart.removeIndicator("volume");
          }
        } catch (_) {}
      }
    });
  }
  // Restore chart style (candles, bars, heikin-ashi, etc.)
  try {
    const s = localStorage.getItem("tradex_price_style");
    if (s && ws.active && ws.active.setPriceStyle) ws.active.setPriceStyle(s);
  } catch (_) {}
  try {
    ws.events.on("cell:priceStyle", (e) => {
      if (e && e.to) {
        localStorage.setItem("tradex_price_style", e.to);
        if (LabEmbedded) window.parent.postMessage({ evt: "priceStyle", style: e.to }, location.origin);
      }
    });
  } catch (_) {}
  // Restore drawings on load immediately and when data settles
  restoreDrawings(window.LabDefaultSymbol);
  setTimeout(() => restoreDrawings(window.LabDefaultSymbol), 300);
  // Auto-save drawings on any change
  const onDrawChange = () => scheduleSave(window.LabDefaultSymbol);
  try {
    ws.chart.on("drawing:created", onDrawChange);
    ws.chart.on("drawing:edited", onDrawChange);
    ws.chart.on("drawing:removed", onDrawChange);
    ws.chart.on("drawing:selected", onDrawChange);
    ws.events.on("state:changed", onDrawChange);
    if (ws.chart && ws.chart.drawings && ws.chart.drawings.ctrl) {
      const ctrl = ws.chart.drawings.ctrl;
      if (ctrl.events) {
        ctrl.events.on("drawing:edited", onDrawChange);
        ctrl.events.on("drawing:created", onDrawChange);
        ctrl.events.on("drawing:removed", onDrawChange);
        ctrl.events.on("drawing:defaults", onDrawChange);
        ctrl.events.on("drawing:settings", onDrawChange);
      }
      if (ctrl.store && ctrl.store.onChange) {
        ctrl.store.onChange(onDrawChange);
      }
    }
    (ws.cells ? ws.cells() : [ws.active]).forEach((c) => {
      if (c && c.on) {
        c.on("drawing:edited", onDrawChange);
        c.on("drawing:created", onDrawChange);
        c.on("drawing:removed", onDrawChange);
      }
      if (c && c.chart && c.chart.drawings && c.chart.drawings.ctrl) {
        const ctrl = c.chart.drawings.ctrl;
        if (ctrl.events) {
          ctrl.events.on("drawing:edited", onDrawChange);
          ctrl.events.on("drawing:created", onDrawChange);
          ctrl.events.on("drawing:removed", onDrawChange);
          ctrl.events.on("drawing:defaults", onDrawChange);
        }
        if (ctrl.store && ctrl.store.onChange) {
          ctrl.store.onChange(onDrawChange);
        }
      }
    });
  } catch (_) {}
  // Floating favourites bar for starred drawing tools (drawing_favbar.js).
  try { TradeXFavBar.mount(ws, host); } catch (e) { console.warn("favourites bar", e); }
  try { TradeXDrawingTemplates.mount(ws); } catch (e) { console.warn("drawing templates", e); }
  try { TradeXStyleFavBar.mount(ws); } catch (e) { console.warn("style favourites bar", e); }
  try { TradeXAutoFit.mount(ws); } catch (e) { console.warn("order-flow auto fit", e); }
  // Colour every chart once its first history is in (the volume indicator mounts with the data).
  setTimeout(applyTheme, 1500);
  // Tell the TradeX shell when the symbol or timeframe is changed inside Vela.
  ws.chart.on("market:changed", ({ symbol, timeframe }) => {
    // Remember the current market, so a layout rebuild opens on it (not on the first symbol).
    if (symbol) window.LabDefaultSymbol = String(symbol).replace(/^lab:/, "");
    if (timeframe) window.LabDefaultTF = LabTF.fromAny(timeframe);
  });
  // An indicator removed from Vela's legend: the hub forgets it too (else it comes back on reload).
  // Settings changed in Vela's dialog: the hub stores the values so they survive a reload.
  try { ws.chart.on("indicator:inputs", (ev) => { const h = ws.chart.indicators().find((x) => x.id === (ev && ev.id)); if (LabEmbedded && h) window.parent.postMessage({ evt: "ind:inputs", id: h.id, inputs: h.inputValues(), props: h.propValues ? h.propValues() : {} }, location.origin); }); } catch (_) {}
  // Last run per script (plot values): proof that an indicator really produced numbers (click test, status).
  window.lastRuns = {};
  try { ws.chart.on("script:run", (ev) => { if (ev && ev.id) window.lastRuns[ev.id] = { plots: ev.plots || {}, bar: ev.bar, warnings: (ev.warnings || []).length, at: Date.now() }; }); } catch (_) {}
  const onIndRemoved = (ev) => {
    const id = ev && ev.id;
    if (id === "volume" || (typeof id === "string" && id.toLowerCase().includes("volume"))) {
      try { localStorage.setItem("tradex_volume_removed", "1"); } catch (_) {}
    }
    if (LabEmbedded && ev && ev.id) window.parent.postMessage({ evt: "ind:removed", id: ev.id }, location.origin);
  };
  try {
    ws.chart.on("indicator:removed", onIndRemoved);
    (ws.cells ? ws.cells() : [ws.active]).forEach((c) => {
      if (c && c.chart && c.chart !== ws.chart) c.chart.on("indicator:removed", onIndRemoved);
    });
    ws.events.on("cell:created", ({ id }) => {
      const cell = ws.cell ? ws.cell(id) : null;
      if (cell && cell.chart) {
        cell.chart.on("indicator:removed", onIndRemoved);
        if (localStorage.getItem("tradex_volume_removed") === "1" && cell.chart.orchestrator) {
          cell.chart.orchestrator.volumeOptedOut = true;
        }
      }
    });
  } catch (_) {}
  ws.chart.on("market:changed", ({ symbol, timeframe }) => LabNotify(String(symbol || "").replace(/^lab:/, ""), LabTF.fromAny(timeframe || "1")));
}
build("");
document.getElementById("layout").onchange = (e) => build(e.target.value);

function addCodeTrendline() {
  const b = lastBars, n = b.length; if (n < 30) return null;
  const from = Math.max(2, n - 120), lows = [];
  for (let i = from; i < n - 2; i++) if (b[i].low < b[i-1].low && b[i].low < b[i-2].low && b[i].low < b[i+1].low && b[i].low < b[i+2].low) lows.push(b[i]);
  if (lows.length < 2) return null;
  const a = lows.reduce((m, x) => (x.low < m.low ? x : m), lows[0]);
  const later = lows.filter((x) => x.time > a.time);
  const c = later.length ? later.reduce((m, x) => (x.low < m.low ? x : m), later[0]) : lows[lows.length - 1];
  return ws.chart.drawings.add("trendline", { paneId: "price", anchors: [{ time: a.time, price: a.low }, { time: c.time, price: c.low }] });
}
document.getElementById("auto").onclick = addCodeTrendline;
window.labChart = {
  name: "vela",
  // Switch in place: indicators re-run on the new bars; panes, drawings and settings stay.
  // Layout in place (cells keep their state); new cells get the theme colours.
  setLayout: (layout) => { document.getElementById("layout").value = layout || ""; if (ws.setLayout) { ws.setLayout(layout || "1"); setTimeout(applyTheme, 1500); } else build(layout || ""); },
  applyTheme,
  // Add a Pine Script indicator to the active chart. Resolves {ok, id, error}.
  removePine: (id) => {
    const h = (window.pineHandles || {})[id] || ws.chart.indicators().find((x) => x.id === id);
    if (h) { h.remove(); if (window.pineHandles) delete window.pineHandles[id]; return true; } return false;
  },
  // Vela's own (native, core-computed) indicators: catalog, add.
  natives: async () => (await ws.chart.availableNativeIndicators()).map((n) => ({ type: n.type, title: n.title, supported: n.supported, present: n.present, multi: !!n.multiInstance, beta: !!n.beta })),
  addNative: (type, inputs) => {
    try {
      if (type === "volume") {
        try { localStorage.removeItem("tradex_volume_removed"); } catch (_) {}
      }
      const h = ws.chart.addNativeIndicator(type, inputs ? { inputs } : undefined);
      if (!h || !h.id) return { ok: false, error: "not available on this chart" };
      (window.pineHandles = window.pineHandles || {})[h.id] = h; return { ok: true, id: h.id, title: h.title };
    } catch (e) { return { ok: false, error: String(e.message || e) }; }
  },
  // Everything on the chart now (script + native), for the dialog and for the click tests.
  lastRun: (id) => (window.lastRuns || {})[id] || null,
  onChart: () => ws.chart.indicators().map((h) => ({ id: h.id, title: h.title, native: h.nativeType || null, visible: h.visible })),
  addPine: async (source, inputs, props) => {
    try {
      const opt = {}; if (inputs && Object.keys(inputs).length) opt.inputs = inputs; if (props && Object.keys(props).length) opt.props = props;
      const h = ws.chart.addIndicator(source, opt);
      (window.pineHandles = window.pineHandles || {})[h.id] = h;
      const res = await new Promise((done) => {
        const t = setTimeout(() => done({ ok: true, id: h.id, pending: true, note: "no result within 15 s (no chart data yet?)" }), 15000);
        h.on("ready", () => { clearTimeout(t); done({ ok: true, id: h.id, title: h.title });
          if (LabEmbedded) window.parent.postMessage({ evt: "ind:ready", id: h.id }, location.origin); });  // also after a late start
        h.on("error", ({ error }) => { clearTimeout(t); done({ ok: false, id: h.id, error: String(error && error.message || error) }); });
      });
      return res;
    } catch (e) { return { ok: false, error: String(e.message || e) }; }
  },
  setMarket: (symbol, tf) => {
    saveDrawings(window.LabDefaultSymbol);
    window.LabDefaultSymbol = symbol;
    window.LabDefaultTF = tf || LabDefaultTF;
    const r = ws.chart.setMarket({ symbol: "lab:" + symbol, timeframe: VELA_TF[tf] || "1" });
    setTimeout(() => restoreDrawings(symbol), 400);
    return r;
  },
  setTF: (t) => ws.chart.setTimeframe ? ws.chart.setTimeframe({ M1: "1", M3: "3", M5: "5", M15: "15", M30: "30", H1: "60", H4: "240", D1: "1D", W1: "1W" }[t]) : null,
  setPriceStyle: (style) => {
    if (ws && ws.active && ws.active.setPriceStyle) {
      ws.active.setPriceStyle(style);
      localStorage.setItem("tradex_price_style", style);
    }
  },
  getPriceStyle: () => (ws && ws.active && ws.active.priceStyle) || localStorage.getItem("tradex_price_style") || "candles",
  addCodeTrendline,
  drawingCount: () => { try { return (ws.chart.drawings.all ? ws.chart.drawings.all().length : ws.chart.drawings.toJSON().drawings.length); } catch (_) { return -1; } },
  saveDrawings,
  restoreDrawings,
  barCount: () => lastBars.length,
};

// Remove volume indicator detection from legend click
document.addEventListener("click", (e) => {
  const btn = e.target && e.target.closest && e.target.closest("button, [role='button'], .vela-legend-action");
  if (!btn) return;
  const row = btn.closest(".vela-legend-item, [data-indicator-id]");
  if (row) {
    const rowText = (row.textContent || "").toLowerCase();
    const action = (btn.getAttribute("data-action") || btn.getAttribute("title") || btn.getAttribute("aria-label") || "").toLowerCase();
    const isTrash = action.includes("remove") || action.includes("delete") || !!btn.querySelector("svg path[d*='trash'], svg path[d*='M6']");
    if (rowText.includes("volume") && isTrash) {
      try { localStorage.setItem("tradex_volume_removed", "1"); } catch (_) {}
      if (LabEmbedded) window.parent.postMessage({ evt: "ind:removed", id: "volume" }, location.origin);
    }
  }
}, true);
</script>
